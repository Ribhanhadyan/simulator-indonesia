<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Simulasi Bot · Simulator Indonesia</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f1;
        --card: #fff;
        --tx: #1a201b;
        --mut: #5a665c;
        --line: #d5dacf;
        --brand: #c9281d;
        --ok: #1b7f3a;
        --bad: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1612;
          --card: #18221c;
          --tx: #ecf1ea;
          --mut: #9aab9f;
          --line: #2f3d34;
          --ok: #5fd68a;
          --bad: #ff8077;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px 14px 60px;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 17px;
      }
      .mut {
        color: var(--mut);
      }
      .s {
        font-size: 13px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        margin: 14px 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        color: var(--mut);
      }
      select,
      input {
        font:
          15px system-ui,
          sans-serif;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--tx);
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      button {
        font:
          600 14px system-ui,
          sans-serif;
        padding: 9px 16px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--tx);
        cursor: pointer;
      }
      button#go {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      progress {
        width: 100%;
        height: 10px;
        margin-top: 12px;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--mut);
      }
      .up {
        color: var(--ok);
        font-weight: 600;
      }
      .dn {
        color: var(--bad);
        font-weight: 600;
      }
      .hb {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin: 2px 0;
      }
      .hb span {
        width: 70px;
        color: var(--mut);
        text-align: right;
      }
      .hb i {
        display: block;
        height: 14px;
        background: var(--brand);
        border-radius: 3px;
        min-width: 2px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        margin: 6px 0;
      }
      code {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🎲 Simulasi Bot</h1>
      <p class="mut">Memainkan game asli (<code>index.html</code> dan semua <code>js/</code>) berulang kali dengan semua pemain bot, tanpa animasi. Hanya untuk pengembang. Simpanan permainanmu tidak disentuh.</p>

      <section class="card">
        <div class="grid">
          <label
            >Jumlah game
            <select id="g-n">
              <option>5</option>
              <option>20</option>
              <option>50</option>
              <option selected>100</option>
              <option>200</option>
              <option>500</option>
            </select>
          </label>
          <label
            >Jumlah pemain
            <select id="p-n">
              <option>2</option>
              <option>3</option>
              <option selected>4</option>
            </select>
          </label>
          <label
            >Level
            <select id="lv">
              <option value="0">🌴 Santai</option>
              <option value="1" selected>⚖️ Sedang</option>
              <option value="2">💀 Kejam</option>
            </select>
          </label>
          <label
            >Gaya bot
            <select id="bs">
              <option value="0" selected>Seimbang</option>
              <option value="1">Agresif</option>
              <option value="2">Konservatif</option>
            </select>
          </label>
          <label
            >Batas putaran
            <select id="rl">
              <option>50</option>
              <option selected>80</option>
              <option>120</option>
              <option>200</option>
            </select>
          </label>
          <label
            >Uang awal
            <select id="cash">
              <option value="10000000">Rp10 jt</option>
              <option value="15000000" selected>Rp15 jt</option>
              <option value="25000000">Rp25 jt</option>
            </select>
          </label>
          <label
            >Krisis ekonomi
            <select id="cr">
              <option value="1" selected>Aktif</option>
              <option value="0">Nonaktif</option>
            </select>
          </label>
          <label
            >MBG
            <select id="mbg">
              <option value="1" selected>Aktif</option>
              <option value="0">Nonaktif</option>
            </select>
          </label>
          <label
            >Seed awal (game ke-i memakai seed + i)
            <input id="seed" type="number" min="1" />
          </label>
          <label
            >Batas waktu per game
            <select id="to">
              <option value="60">60 detik</option>
              <option value="120" selected>120 detik</option>
              <option value="300">300 detik</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button id="go">▶ Mulai</button>
          <button id="stop" disabled>■ Berhenti</button>
          <button id="exp" disabled>⬇ Unduh JSON</button>
        </div>
        <progress id="pg" value="0" max="1"></progress>
        <div id="st" class="mut s">Siap.</div>
      </section>

      <div id="out"></div>
    </main>

    <script>
      const $ = (s) => document.querySelector(s);

      /* ====================================================================
         Dua fungsi di bawah dijalankan DI DALAM iframe game. Keduanya dikirim
         lewat .toString(), jadi hanya boleh memakai variabel global game.
         ==================================================================== */

      /* Math.random deterministik (mulberry32) supaya game bisa diulang dengan seed yang sama */
      function seedRng(seed) {
        let a = seed >>> 0;
        Math.random = () => {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /* Disuntik sebelum js/13-multiplayer.js: menimpa dialog setup, jeda, simpan, ringkasan; mencatat statistik */
      function glue() {
        const SC = parent.__SIMCFG;

        /* 1. timer tanpa jeda dan tanpa batas 4 ms (pesan antar-port), tetap memberi napas ke browser */
        const chan = new MessageChannel(),
          queue = [];
        chan.port1.onmessage = () => {
          const f = queue.shift();
          if (typeof f == "function") f();
        };
        window.setTimeout = (f) => {
          queue.push(f);
          chan.port2.postMessage(0);
          return 0;
        };

        /* 2. jangan menyentuh localStorage, jangan menampilkan dialog setup */
        save = () => {};
        clearSave = () => {};
        boot = () => {};
        setupRules = async () => {
          Object.assign(SET, SC.set);
          MBG_MAX = SET.mbg ? 1 : 0;
        };
        const askAsli = ask;
        ask = (h, b, w) => {
          if (/Siapa saja yang main/.test(h)) return Promise.resolve(SC.n);
          if (/Tingkat Kesulitan/.test(h)) return Promise.resolve(SC.lv);
          if (/<h3>Nama Pemain/.test(h)) {
            mod.innerHTML = h;
            mod.querySelectorAll(".sr").forEach((r, i) => {
              r.querySelector("select").value = "1";
              r.querySelector("input").value = "Bot " + (i + 1);
            });
            return Promise.resolve(1);
          }
          return askAsli(h, b, w);
        };
        wait = async (label) => {
          const p = P[cur];
          if (!(p && p.b)) throw new Error("Giliran manusia terdeteksi di mode simulasi");
          if (label[0] == "A") {
            botManage(p);
            botCards(p);
          }
        };

        /* 3. pencatat statistik */
        const RR = {},
          BK = [];
        let chSum = 0,
          chMax = 0,
          chN = 0;
        const rec = () => {
          P.forEach((p) => {
            if (p.x || p.role === undefined) return;
            const r = (RR[p.id] = RR[p.id] || {}),
              n = R(p).n;
            r[n] = (r[n] || 0) + 1;
          });
          const c = nChaos();
          chSum += c;
          chN++;
          if (c > chMax) chMax = c;
        };
        const fzAsli = fzUpdate;
        fzUpdate = async function () {
          rec();
          return fzAsli.apply(this, arguments);
        };
        const bangkrutAsli = bankrupt;
        bankrupt = function (p, to) {
          if (!p.x) BK.push({ id: p.id, rnd, stage: crS(), cause: to ? "pemain" : p.loans.some((l) => l.n <= 0) ? "utang" : "negara" });
          return bangkrutAsli.apply(this, arguments);
        };
        summary = async (w) => {
          try {
            rec();
          } catch (e) {}
          const res = {
            rounds: rnd,
            end: END ? "cap" : "last",
            win: w ? w.id : -1,
            pool: POOL,
            neg: nneg(),
            stage: crS(),
            chAvg: chN ? chSum / chN : 0,
            chMax,
            pl: P.map((p) => {
              const s = ST[p.id] || {};
              return { id: p.id, x: p.x ? 1 : 0, nw: p.x ? 0 : Math.round(nw(p)), fin: R(p).n, roles: RR[p.id] || {}, rent: s.rent || 0, jail: s.jail || 0, taken: s.taken || 0 };
            }),
            bk: BK,
          };
          SC.onEnd(parent.JSON.parse(JSON.stringify(res)));
          await new Promise(() => {}); /* tahan di sini, jangan sampai location.reload() */
        };

        /* 4. titik mulai (dipanggil dari halaman induk setelah semua script termuat) */
        window.__simStart = () => {
          render = () => {};
          return game();
        };
        const lapor = (m) => SC.onError(m + " [putaran " + rnd + "]");
        addEventListener("unhandledrejection", (e) => lapor(String((e.reason && (e.reason.stack || e.reason.message)) || e.reason)));
        addEventListener("error", (e) => lapor(String(e.message)));
      }

      /* ====================================================================
         Halaman induk
         ==================================================================== */
      const TAG = '<script src="js/13-multiplayer.js"><\/script>';
      let cfg = null,
        results = [],
        running = false,
        stopFlag = false,
        curCancel = null;

      async function template() {
        const r = await fetch("index.html", { cache: "no-store" });
        if (!r.ok) throw new Error("Gagal membaca index.html (HTTP " + r.status + ")");
        const h = await r.text();
        if (!h.includes(TAG)) throw new Error('Tag <script src="js/13-multiplayer.js"><\/script> tidak ditemukan di index.html');
        if (!/<head>/i.test(h)) throw new Error("Tag <head> tidak ditemukan di index.html");
        return h;
      }

      const mkDoc = (h, seed) =>
        h
          .replace(/<link\b[^>]*>/gi, "")
          .replace('"serviceWorker" in navigator', "false")
          .replace(/<head>/i, () => '<head><base href="' + new URL("./", location.href).href + '"><script>(' + seedRng.toString() + ")(" + (seed >>> 0) + ")<\/script>")
          .replace(TAG, () => "<script>(" + glue.toString() + ")()<\/script>" + TAG);

      function runOne(seed, tpl) {
        return new Promise((resolve) => {
          const fr = document.createElement("iframe");
          fr.style.cssText = "position:fixed;left:-9999px;top:0;width:1000px;height:800px;border:0;visibility:hidden";
          const t0 = performance.now();
          let done = false,
            wd = 0;
          const finish = (r) => {
            if (done) return;
            done = true;
            clearTimeout(wd);
            curCancel = null;
            setTimeout(() => fr.remove(), 0);
            resolve({ seed, ms: Math.round(performance.now() - t0), ...r });
          };
          curCancel = () => finish({ ok: 0, cancel: 1, err: "dibatalkan" });
          window.__SIMCFG = { n: cfg.n, lv: cfg.lv, set: cfg.set, onEnd: (r) => finish({ ok: 1, ...r }), onError: (m) => finish({ ok: 0, err: String(m) }) };
          wd = setTimeout(() => finish({ ok: 0, timeout: 1, err: "melebihi " + cfg.timeout + " detik (kemungkinan macet)" }), cfg.timeout * 1000);
          fr.onload = () => {
            const w = fr.contentWindow;
            if (done || !w) return;
            if (typeof w.__simStart != "function") {
              if (w.location.href == "about:blank") return;
              return finish({ ok: 0, err: "Kode pembantu tidak terpasang (cek console)" });
            }
            try {
              w.__simStart().catch((e) => finish({ ok: 0, err: String((e && e.stack) || e) }));
            } catch (e) {
              finish({ ok: 0, err: String((e && e.stack) || e) });
            }
          };
          fr.srcdoc = mkDoc(tpl, seed);
          document.body.appendChild(fr);
        });
      }

      const readCfg = () => ({
        games: +$("#g-n").value,
        n: +$("#p-n").value,
        lv: +$("#lv").value,
        set: { cash: +$("#cash").value, mbg: +$("#mbg").value, cr: +$("#cr").value, rl: +$("#rl").value, bs: +$("#bs").value, sp: 1 },
        seed: Math.max(1, +$("#seed").value || 1),
        timeout: +$("#to").value,
      });
      const ui = (on) => {
        $("#go").disabled = on;
        $("#stop").disabled = !on;
        $("#exp").disabled = on || !results.length;
      };

      async function start() {
        if (running) return;
        cfg = readCfg();
        results = [];
        stopFlag = false;
        running = true;
        ui(true);
        $("#pg").value = 0;
        $("#out").innerHTML = "";
        let tpl;
        try {
          tpl = await template();
        } catch (e) {
          $("#st").textContent = "❌ " + e.message;
          running = false;
          ui(false);
          return;
        }
        const t0 = performance.now();
        for (let i = 0; i < cfg.games && !stopFlag; i++) {
          const r = await runOne(cfg.seed + i, tpl);
          if (r.cancel) break;
          results.push(r);
          const d = results.length,
            el = (performance.now() - t0) / 1000,
            eta = (el / d) * (cfg.games - d);
          $("#pg").value = d / cfg.games;
          $("#st").textContent = `${d}/${cfg.games} game · ${results.filter((x) => !x.ok).length} gagal · ${el.toFixed(0)} dtk · sisa ±${eta.toFixed(0)} dtk`;
          if (d % 5 == 0 || d == cfg.games) report();
        }
        running = false;
        report();
        ui(false);
        $("#st").textContent += stopFlag ? " · dihentikan" : " · selesai";
      }
      $("#go").onclick = start;
      $("#stop").onclick = () => {
        stopFlag = true;
        if (curCancel) curCancel();
      };
      $("#exp").onclick = () => {
        const blob = new Blob([JSON.stringify({ cfg, hasil: results }, null, 1)], { type: "application/json" }),
          a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "simulasi-hasil.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };

      /* ---------- laporan ---------- */
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const fmt = (n, d = 1) => n.toFixed(d).replace(".", ",");
      const jt = (n) => fmt(n / 1e6) + " jt";
      const pct = (x) => fmt(x * 100) + "%";
      const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
      const qnt = (a, p) => {
        const s = [...a].sort((x, y) => x - y);
        return s.length ? s[Math.min(s.length - 1, Math.floor(p * s.length))] : 0;
      };
      const tbl = (head, rows) =>
        "<div class='tw'><table><thead><tr>" + head.map((h) => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>" + rows.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
      const card = (t, b, note) => "<section class='card'><h2>" + t + "</h2>" + b + (note ? "<p class='mut s'>" + note + "</p>" : "") + "</section>";

      function report() {
        if (!results.length) return;
        const ok = results.filter((r) => r.ok),
          bad = results.filter((r) => !r.ok),
          N = cfg.n,
          G = ok.length;
        let h = "";
        const rd = ok.map((r) => r.rounds),
          bkAll = ok.flatMap((r) => r.bk);

        h += card(
          "Ringkasan",
          tbl(
            ["Metrik", "Nilai"],
            [
              ["Game selesai / gagal", G + " / " + bad.length],
              ["Putaran: rata-rata · median · P90 · maks", G ? [fmt(avg(rd)), qnt(rd, 0.5), qnt(rd, 0.9), Math.max(...rd)].join(" · ") : "-"],
              ["Berakhir karena batas putaran", G ? pct(ok.filter((r) => r.end == "cap").length / G) + " (sisanya: pemain terakhir bertahan)" : "-"],
              ["Bangkrut per game", G ? fmt(bkAll.length / G, 2) + " dari " + N + " pemain" : "-"],
              ["Kekacauan berita: rata-rata · puncak rata-rata", G ? fmt(avg(ok.map((r) => r.chAvg))) + "% · " + fmt(avg(ok.map((r) => r.chMax))) + "%" : "-"],
              ["Tahap krisis di akhir game (rata-rata)", G ? fmt(avg(ok.map((r) => r.stage))) : "-"],
              ["Dana APBN akhir (rata-rata)", G ? jt(avg(ok.map((r) => r.pool))) : "-"],
              ["Aset negara akhir (rata-rata)", G ? fmt(avg(ok.map((r) => r.neg))) + " properti" : "-"],
              ["Waktu per game", fmt(avg(results.map((r) => r.ms)) / 1000, 2) + " dtk"],
            ],
          ),
        );

        if (G) {
          /* urutan giliran */
          const rows = [];
          for (let s = 0; s < N; s++) {
            const w = ok.filter((r) => r.win === s).length,
              z = (w - G / N) / Math.sqrt(G * (1 / N) * (1 - 1 / N));
            rows.push(["Pemain " + (s + 1) + (s ? "" : " (jalan pertama)"), w, pct(w / G), pct(1 / N), fmt(z)]);
          }
          h += card("Keuntungan urutan giliran", tbl(["Kursi", "Menang", "Menang %", "Seharusnya", "z"], rows), "z di luar ±2 menandakan selisih yang kecil kemungkinan murni kebetulan.");

          /* peran: menang dibobot lama memegang peran */
          const E = {};
          ok.forEach((g) =>
            g.pl.forEach((p) => {
              const tot = Object.values(p.roles).reduce((s, x) => s + x, 0);
              if (!tot) return;
              for (const [rn, c] of Object.entries(p.roles)) {
                const w = c / tot,
                  e = (E[rn] = E[rn] || { ex: 0, win: 0, nw: 0, bk: 0 });
                e.ex += w;
                if (p.id === g.win) e.win += w;
                e.nw += w * p.nw;
                if (p.x) e.bk += w;
              }
            }),
          );
          const p0 = 1 / N,
            rr = Object.entries(E)
              .map(([n, e]) => {
                const exp = e.ex * p0;
                return { n, ...e, idx: exp ? e.win / exp : 0, z: e.ex ? (e.win - exp) / Math.sqrt(e.ex * p0 * (1 - p0)) : 0, anw: e.nw / e.ex, bkr: e.bk / e.ex };
              })
              .sort((a, b) => b.idx - a.idx);
          h += card(
            "Kekuatan peran",
            tbl(
              ["Peran", "Paparan", "Menang %", "Indeks", "z", "Kekayaan akhir", "Bangkrut %", "Penilaian"],
              rr.map((r) => [
                r.n,
                fmt(r.ex, 0),
                pct(r.ex ? r.win / r.ex : 0),
                fmt(r.idx, 2),
                fmt(r.z),
                jt(r.anw),
                pct(r.bkr),
                r.ex < 30 ? "<span class='mut'>data kurang</span>" : r.z >= 2 ? "<span class='up'>🔺 kuat</span>" : r.z <= -2 ? "<span class='dn'>🔻 lemah</span>" : "wajar",
              ]),
            ),
            "Paparan = jumlah pemain-game yang memegang peran itu (dibobot lamanya memegang peran, karena peran bisa berganti). Indeks 1,00 = menang sebanyak porsi wajar (1/" +
              N +
              " per pemain). Dengan 16 peran, satu-dua peran bisa terbendera hanya karena kebetulan; naikkan jumlah game sebelum menyimpulkan.",
          );

          /* penyebab bangkrut */
          const CA = { pemain: "Tidak mampu bayar ke pemain (sewa, interaksi peran)", utang: "Utang bank jatuh tempo", negara: "Tidak mampu bayar ke negara (pajak, denda, PBB, sewa aset negara, suap)" };
          h += card(
            "Penyebab bangkrut",
            bkAll.length
              ? tbl(
                  ["Penyebab", "Jumlah", "Porsi", "Putaran rata-rata", "Tahap krisis rata-rata"],
                  Object.keys(CA).map((k) => {
                    const a = bkAll.filter((b) => b.cause == k);
                    return [CA[k], a.length, pct(a.length / bkAll.length), a.length ? fmt(avg(a.map((b) => b.rnd))) : "-", a.length ? fmt(avg(a.map((b) => b.stage))) : "-"];
                  }),
                )
              : "<p class='mut'>Tidak ada yang bangkrut.</p>",
            "Pengelompokan ini perkiraan dari tujuan pembayaran saat menyerah.",
          );

          /* histogram panjang game */
          const mx = Math.max(...rd),
            bs = 10,
            bins = Array(Math.floor(mx / bs) + 1).fill(0);
          rd.forEach((x) => bins[Math.floor(x / bs)]++);
          const top = Math.max(...bins);
          h += card("Sebaran panjang game (putaran)", bins.map((c, i) => `<div class="hb"><span>${i * bs}–${i * bs + bs - 1}</span><i style="width:${(c / top) * 60}%"></i><b>${c}</b></div>`).join(""));
        }

        if (bad.length) {
          h += card(
            "Game gagal (" + bad.length + ")",
            bad
              .slice(0, 10)
              .map((r) => "<pre><b>seed " + r.seed + (r.timeout ? " · TIMEOUT" : "") + "</b>\n" + esc(r.err).slice(0, 400) + "</pre>")
              .join("") + (bad.length > 10 ? "<p class='mut s'>…dan " + (bad.length - 10) + " lainnya (lihat JSON).</p>" : ""),
            "Ulang satu game yang gagal: isi Seed awal dengan seed di atas, Jumlah game = 5 (atau 1 lewat JSON), dengan pengaturan yang sama dan kode yang sama.",
          );
        }
        $("#out").innerHTML = h;
      }

      $("#seed").value = Math.floor(Math.random() * 1e6) + 1;
      if (location.protocol == "file:") $("#st").textContent = "⚠️ Dibuka lewat file://. Jalankan server lokal (python3 -m http.server 8000) lalu buka lewat http://localhost:8000/simulasi.html";
    </script>
  </body>
</html>
