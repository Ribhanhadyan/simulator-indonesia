<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Monopoli Indonesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #e8ede2;
        --tx: #1b1b1b;
        --card: #fffdf3;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #17201a;
          --tx: #eee;
          --card: #2a2f2b;
        }
      }
      :root[data-theme="dark"] {
        --bg: #17201a;
        --tx: #eee;
        --card: #2a2f2b;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family: Oswald, Impact, "Arial Narrow", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        align-items: flex-start;
        padding: 8px;
      }
      #board {
        --s: min(94vw, calc(100vh - 24px), 780px);
        width: var(--s);
        height: var(--s);
        display: grid;
        grid-template: 1.7fr repeat(10, 1fr) 1.7fr/1.7fr repeat(10, 1fr) 1.7fr;
        border: 3px solid #111;
        background: #cde6d2;
        font-size: calc(var(--s) / 113);
        color: #111;
      }
      .t {
        border: 1px solid #111;
        background: #e6f2e3;
        position: relative;
        display: flex;
        overflow: hidden;
        cursor: pointer;
        line-height: 1.05;
        text-align: center;
      }
      .bo {
        flex-direction: column;
      }
      .to {
        flex-direction: column-reverse;
      }
      .le {
        flex-direction: row-reverse;
      }
      .ri {
        flex-direction: row;
      }
      .cn {
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #f2f7ee;
      }
      .bar {
        flex: 0 0 24%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1px;
        flex-wrap: wrap;
        border: 0 solid #111;
      }
      .bo .bar {
        border-bottom-width: 1px;
      }
      .to .bar {
        border-top-width: 1px;
      }
      .le .bar {
        border-left-width: 1px;
      }
      .ri .bar {
        border-right-width: 1px;
      }
      .h {
        width: 1em;
        height: 1em;
        background: #1fb25a;
        border: 1px solid #111;
        display: block;
      }
      .h.H {
        background: #d62b1f;
        width: 2em;
      }
      .in {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1px;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.95em;
      }
      .cn .in {
        font-size: 1.15em;
      }
      .in i {
        font-style: normal;
        font-size: 1.9em;
      }
      .in small {
        font-size: 0.95em;
        font-weight: 400;
        text-transform: none;
      }
      .tk {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        font-size: 2em;
        line-height: 1;
        text-shadow:
          0 0 3px #fff,
          0 0 3px #fff;
      }
      #ctr {
        grid-area: 2/2/12/12;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4em;
        overflow: hidden;
      }
      .ban {
        z-index: 1;
        background: #d62b1f;
        color: #fff;
        font:
          700 10em/1 Oswald,
          Impact,
          sans-serif;
        letter-spacing: 0.04em;
        padding: 0.05em 0.25em 0;
        border: 0.06em solid #111;
        transform: rotate(-6deg);
        box-shadow: 0.06em 0.08em 0 #0005;
        text-align: center;
      }
      .ban small {
        display: block;
        font-size: 0.26em;
        background: #fff;
        color: #d62b1f;
        letter-spacing: 0.7em;
        padding: 0.25em 0 0.25em 0.7em;
        margin: 0 -0.97em 0 -0.97em;
        border-top: 0.2em solid #111;
      }
      .dk {
        position: absolute;
        width: 21%;
        height: 11%;
        border: 2px solid #111;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          700 1.6em Oswald,
          sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transform: rotate(45deg);
      }
      .d1 {
        left: 9%;
        top: 11%;
        background: #f7941d;
      }
      .d2 {
        right: 9%;
        bottom: 11%;
        background: #aee0f6;
      }
      #dice {
        z-index: 1;
        display: flex;
        gap: 1.4em;
        min-height: 6em;
      }
      .die {
        width: 6em;
        height: 6em;
        background: #fff;
        border: 2px solid #111;
        border-radius: 1em;
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        padding: 0.7em;
        box-shadow: 0.2em 0.3em 0 #0004;
      }
      .die i {
        width: 1.3em;
        height: 1.3em;
        border-radius: 50%;
        margin: auto;
      }
      .die i.p {
        background: #111;
      }
      #now {
        z-index: 1;
        font:
          600 1.7em Oswald,
          sans-serif;
        text-align: center;
        background: #fffdf3cc;
        padding: 0.3em 0.8em;
        border-radius: 0.4em;
        max-width: 80%;
        min-height: 1.6em;
      }
      #side {
        flex: 1 1 300px;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 15px;
      }
      .btns {
        display: flex;
        gap: 8px;
      }
      button {
        font:
          600 15px Oswald,
          sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 10px 12px;
        border: 2px solid #111;
        border-radius: 4px;
        background: #fff;
        color: #111;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 3px solid #ffd400;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #roll {
        flex: 2;
        background: #d62b1f;
        color: #fff;
      }
      #mng {
        flex: 1;
      }
      .pc {
        background: var(--card);
        border: 3px solid;
        border-radius: 6px;
        padding: 6px 8px;
      }
      .pc.on {
        box-shadow: 0 0 0 3px #ffd400;
      }
      .pc.out {
        opacity: 0.35;
        text-decoration: line-through;
      }
      .pc span {
        font-size: 1.4em;
      }
      .cash {
        font-weight: 700;
        font-size: 1.25em;
        color: #1b7f3a;
      }
      .ch s {
        display: inline-block;
        width: 1.5em;
        height: 1.5em;
        border: 1px solid #111;
        margin: 1px;
        cursor: pointer;
        font:
          700 11px/1.45em Oswald,
          sans-serif;
        text-align: center;
        text-shadow:
          0 0 2px #fff,
          0 0 2px #fff;
      }
      #log {
        background: var(--card);
        border-radius: 6px;
        padding: 6px 8px;
        height: 150px;
        overflow: auto;
        font:
          400 13px/1.4 system-ui,
          sans-serif;
      }
      #ov {
        position: fixed;
        inset: 0;
        background: #000b;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9;
        padding: 12px;
      }
      #ov[hidden] {
        display: none;
      }
      #mod {
        background: #fffdf3;
        color: #111;
        border: 3px solid #111;
        border-radius: 6px;
        max-width: 440px;
        width: 100%;
        max-height: 90vh;
        overflow: auto;
        padding-bottom: 12px;
        font-size: 16px;
      }
      #mod h3 {
        margin: 0 0 8px;
        padding: 10px;
        background: #d62b1f;
        color: #fff;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 20px;
      }
      #mod p {
        margin: 6px 14px;
        text-align: center;
        line-height: 1.35;
      }
      .mb {
        display: flex;
        gap: 8px;
        padding: 8px 14px 0;
        flex-wrap: wrap;
      }
      .mb button {
        flex: 1;
        min-width: 110px;
      }
      #mod input {
        display: block;
        width: calc(100% - 28px);
        margin: 6px 14px;
        padding: 8px;
        font:
          16px Oswald,
          sans-serif;
        border: 2px solid #111;
        border-radius: 4px;
      }
      .mr {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 4px 10px;
        padding: 4px;
        border: 1px solid #bbb;
        border-radius: 4px;
        flex-wrap: wrap;
        font-size: 14px;
      }
      .mr b {
        flex: 1 1 100%;
        padding: 2px 6px;
        border: 1px solid #111;
      }
      .mr button {
        padding: 5px 7px;
        font-size: 12px;
      }
      #bw {
        flex: 0 1 auto;
        max-width: 100%;
        overflow: auto;
      }
      #board {
        --s: max(min(94vw, calc(100vh - 24px), 780px), 620px);
      }
      .t {
        font-size: 1.3em;
      }
      .tk {
        font-size: 1.5em;
      }
      .in {
        padding: 2px;
        gap: 1px;
      }
      .cn .in {
        font-size: 1.05em;
      }
      #who {
        flex: 1 1 100%;
        text-align: center;
        font:
          700 clamp(18px, 3.4vw, 26px) Oswald,
          sans-serif;
        padding: 8px 12px;
        border: 3px solid #111;
        border-radius: 6px;
        color: #fff;
        text-shadow: 0 1px 2px #0008;
        transition: background 0.4s;
      }
      #who:empty {
        display: none;
      }
      #news {
        background: #fff6d6;
        color: #111;
        border: 2px solid #111;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 14px;
        line-height: 1.4;
      }
      .pc.on {
        transform: scale(1.02);
      }
      .pc.on b::after {
        content: " ◀ giliran";
      }
      .cur {
        display: inline-block;
        animation: hop 0.7s ease-in-out infinite;
        filter: drop-shadow(0 0 3px #ffd400);
      }
      @keyframes hop {
        50% {
          transform: translateY(-0.3em);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cur {
          animation: none;
        }
      }
      #mod .sr {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 6px 14px;
      }
      #mod .sr span {
        font-size: 26px;
      }
      #mod .sr input {
        flex: 1;
        margin: 0;
        width: auto;
        min-width: 0;
      }
      #mod select {
        font:
          16px Oswald,
          sans-serif;
        padding: 8px;
        border: 2px solid #111;
        border-radius: 4px;
      }
      #bw {
        padding: 46px;
      }
      #board {
        --s: max(min(calc(100vw - 100px), calc(100vh - 160px), 740px), 600px);
        position: relative;
      }
      .tk {
        display: none;
      }
      #pins {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 6;
      }
      .pw {
        position: absolute;
        width: 3.2em;
        height: 4.4em;
        margin: -4.4em 0 0 -1.6em;
        transform-origin: 50% 100%;
        transition:
          left 0.14s linear,
          top 0.14s linear,
          transform 0.14s linear;
        filter: drop-shadow(0 0.15em 0.15em #0006);
      }
      .pw .pn {
        width: 100%;
        height: 100%;
        display: block;
      }
      .pw.cur {
        z-index: 2;
      }
      .pw.cur .pn {
        animation: hop 0.9s ease-in-out infinite;
        filter: drop-shadow(0 0 0.35em #ffd400);
      }
      .pn {
        width: 0.8em;
        height: 1.15em;
        vertical-align: -0.2em;
      }
      @media (prefers-reduced-motion: reduce) {
        .pw.cur .pn {
          animation: none;
        }
      }
      #app {
        --pad: clamp(24px, 4vw, 44px);
        --s: max(280px, min(calc(100vw - 2 * var(--pad) - 16px), calc(100vh - 170px), 820px));
      }
      #bw {
        padding: var(--pad);
      }
      #board {
        --s: inherit;
      }
      #pins {
        --u: max(1em, 4.5px);
      }
      .ab {
        display: none;
        font-style: normal;
        font-weight: 700;
        font-size: max(0.9em, 5.5px);
      }
      @media (max-width: 760px) {
        .in span {
          display: none;
        }
        .ab {
          display: block;
        }
        .in small {
          font-size: max(1.1em, 6px);
        }
        .in i {
          font-size: max(1.7em, 12px);
        }
        .die {
          width: max(6em, 32px);
          height: max(6em, 32px);
          padding: max(0.7em, 3px);
        }
        .die i {
          width: max(1.3em, 5px);
          height: max(1.3em, 5px);
        }
        #now {
          font-size: max(1.7em, 12px);
        }
        .dk {
          font-size: max(1.5em, 7px);
        }
        .h {
          width: max(1em, 4px);
          height: max(1em, 4px);
        }
        .pw {
          width: max(3.2em, 15px);
          height: max(4.4em, 21px);
          margin: calc(-1 * max(4.4em, 21px)) 0 0 calc(-0.5 * max(3.2em, 15px));
        }
      }
      #mod .sub {
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #555;
        margin: -2px 0 6px;
      }
      .sec {
        margin: 10px 14px 0;
        border: 2px solid #111;
        border-radius: 4px;
        overflow: hidden;
        background: #fff;
      }
      .sec > h4 {
        margin: 0;
        padding: 4px 10px;
        background: #111;
        color: #fff;
        font:
          600 12px Oswald,
          sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .sec .rw {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 5px 10px;
        font-size: 15px;
      }
      .sec .rw + .rw {
        border-top: 1px solid #ddd;
      }
      #mod .sec p {
        margin: 0;
        padding: 8px 10px;
        text-align: left;
      }
      #mod .ct {
        font-size: 17px;
        line-height: 1.4;
      }
      #mod .ef {
        font-weight: 700;
        font-size: 17px;
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }
      .pw.cur .pn {
        animation: sway 3.2s ease-in-out infinite;
        transform-origin: 50% 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        .pw.cur .pn {
          animation: none;
        }
      }
      #bnk {
        flex: 1;
      }
      .dbt {
        font-size: 13px;
        color: #b3261e;
        font-weight: 600;
      }
      .sec .rw button {
        padding: 5px 8px;
        font-size: 12px;
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-1deg);
        }
        50% {
          transform: rotate(1deg);
        }
      }
      .bar {
        flex: 0 0 20%;
      }
      .t .in {
        font-size: 0.78em;
        line-height: 1.1;
      }
      .t.cn .in {
        font-size: 0.95em;
      }
      .t .in small {
        font-size: 0.85em;
      }
      .t .in i {
        font-size: 1.6em;
      }
      @media (max-width: 760px) {
        .t .in {
          font-size: max(0.78em, 6px);
        }
        .t .in small {
          font-size: max(1.1em, 6px);
        }
        .t .in i {
          font-size: max(1.7em, 12px);
        }
      }
      .pw.cur .pn {
        animation: none;
      }
      .btns {
        flex-wrap: wrap;
      }
      #roll {
        flex: 1 1 100%;
      }
      #trd {
        flex: 1;
      }
      #mod .ck {
        display: block;
        padding: 5px 10px;
        border-top: 1px solid #ddd;
        font-size: 15px;
      }
      #mod .ck input {
        display: inline;
        width: auto;
        margin: 0 8px 0 0;
      }
      #mod .sec input[type="number"] {
        width: calc(100% - 20px);
        margin: 6px 10px;
      }
      .pop {
        position: fixed;
        z-index: 30;
        pointer-events: none;
        font:
          700 20px Oswald,
          sans-serif;
        white-space: nowrap;
        text-shadow:
          0 1px 2px #fff,
          0 0 6px #fff;
        animation: rise 2.2s ease-out forwards;
      }
      .pop.up {
        color: #1b7f3a;
      }
      .pop.dn {
        color: #b3261e;
      }
      @keyframes rise {
        0% {
          opacity: 0;
          transform: translateY(8px) scale(0.8);
        }
        12% {
          opacity: 1;
          transform: translateY(0) scale(1.15);
        }
        100% {
          opacity: 0;
          transform: translateY(-44px) scale(1);
        }
      }
      @keyframes fade {
        0%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pop {
          animation: fade 2.2s forwards;
        }
      }
      .pw.cur {
        animation: none;
      }
      .rl {
        font-size: 13px;
        font-weight: 600;
        opacity: 0.85;
      }
      .pw.pol {
        filter: drop-shadow(0 0 0.3em #3f51b5) drop-shadow(0 0.15em 0.15em #0006);
        z-index: 3;
      }
      .h.M {
        background: #2f6bff;
      }
      .mbt {
        color: #2f6bff;
      }
      #kbj {
        flex: 1;
        background: #ffd400;
      }
      #ng {
        flex: 1;
      }
      #ng.arm {
        background: #ffd400;
      }
      #gtab {
        position: fixed;
        right: 0;
        top: 38%;
        z-index: 25;
        writing-mode: vertical-rl;
        padding: 12px 6px;
        background: #d62b1f;
        color: #fff;
        border-right: 0;
        border-radius: 8px 0 0 8px;
        letter-spacing: 0.1em;
      }
      #gb {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(92vw, 420px);
        z-index: 26;
        background: var(--card);
        color: var(--tx);
        border-left: 3px solid #111;
        display: flex;
        flex-direction: column;
        visibility: hidden;
        transform: translateX(100%);
        transition:
          transform 0.25s ease,
          visibility 0s 0.25s;
        padding-top: env(safe-area-inset-top, 0px);
        font:
          400 15px/1.45 system-ui,
          sans-serif;
      }
      #gb.o {
        visibility: visible;
        transform: none;
        transition: transform 0.25s ease;
      }
      .gh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        background: #d62b1f;
        color: #fff;
        font:
          700 20px Oswald,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .gh button {
        padding: 4px 10px;
      }
      #gc {
        overflow: auto;
        padding: 8px 10px 24px;
        flex: 1;
      }
      #gc details {
        border: 2px solid #111;
        border-radius: 6px;
        margin: 8px 0;
        background: var(--bg);
      }
      #gc summary {
        cursor: pointer;
        padding: 8px 10px;
        font:
          600 17px Oswald,
          sans-serif;
        letter-spacing: 0.04em;
      }
      #gc details > div {
        padding: 0 12px 10px;
      }
      #gc ul {
        margin: 4px 0;
        padding-left: 18px;
      }
      #gc li {
        margin: 3px 0;
      }
      #gc p {
        margin: 6px 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #gb,
        #gb.o {
          transition: none;
        }
      }
      .t[data-st]::after {
        content: "🏛️";
        position: absolute;
        top: 0;
        right: 1px;
        font-size: max(1.5em, 9px);
        line-height: 1;
        pointer-events: none;
      }
      .t.la {
        background: #ffe9a8;
      }
      .t.bu {
        background: #cfe3ff;
      }
      .t.ap {
        background: #d9efff;
      }
      .gl {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        font:
          700 max(0.95em, 7px)/1.3 Oswald,

          if (!e) {
            e = document.createElement("div");
            e.id = "ux-toast";
            e.setAttribute("role", "status");
            e.setAttribute("aria-live", "polite");
            document.body.appendChild(e);
          }
          e.textContent = m;
          e.classList.add("on");
          clearTimeout(tt);
          tt = setTimeout(() => e.classList.remove("on"), 2600);
        };

        /* ===== Audio & haptik ===== */
        let ac,
          soundOn = LS("ux-snd") !== "0";
        const tone = (f, d = 0.09, ty = "sine", v = 0.05, at = 0) => {
          if (!soundOn) return;
          try {
            ac = ac || new (window.AudioContext || window.webkitAudioContext)();
            if (ac.state === "suspended") ac.resume();
            const o = ac.createOscillator(),
              g = ac.createGain(),
              t = ac.currentTime + at;
            o.type = ty;
            o.frequency.setValueAtTime(f, t);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(v, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, t + d);
            o.connect(g).connect(ac.destination);
            o.start(t);
            o.stop(t + d + 0.02);
          } catch (e) {}
        };

          dice: () => [0, 1, 2].forEach((i) => tone(180 + i * 40, 0.05, "square", 0.03, i * 0.06)),
          turn: () => {

            tone(880, 0.18, "sine", 0.05, 0.12);

        new MutationObserver(() => {
          $$("#log div").forEach((d) => {
            const t = d.textContent;
            d.className = /bayar|denda|bangkrut|menunggak|disita|menyita|suap|pajak|masuk penjara/i.test(t) ? "neg" : /menerima|gaji|dividen|menang|melunasi|santunan|terima/i.test(t) ? "pos" : "";
          });
        }).observe($("#log"), { childList: true });

        /* ===== Efek suara dari perubahan DOM ===== */
        new MutationObserver(() => {
          SFX.dice();
          buzz(15);
        }).observe($("#dice"), { childList: true });
        new MutationObserver((ms) =>
          ms.forEach((m) =>
            m.addedNodes.forEach((n) => {
              if (n.classList && n.classList.contains("pop")) {
                n.classList.contains("up") ? SFX.up() : SFX.dn();
                buzz(n.classList.contains("dn") ? [30, 40, 30] : 20);
              }
            }),
          ),
        ).observe(document.body, { childList: true });
        let gLast = -1;
        new MutationObserver(() => {
          if (MP.cl && MP.seat >= 0 && MP.cur === MP.seat && gLast !== MP.cur) SFX.turn();
          gLast = MP.cur;
        }).observe($("#who"), { childList: true, characterData: true, subtree: true });

        /* ===== Modal: fokus, trap, restore ===== */
        let prevFocus = null,
          lastBtn = null;
        M.addEventListener(
          "click",
          (e) => {
            const b = e.target.closest("button");
            lastBtn = b ? { a: b.dataset.a, i: b.dataset.i } : null;
            if (b && !b.disabled) {
              SFX.tap();
              buzz(10);
            }
          },
          true,
        );
        function tuneModal() {
          const h = M.querySelector("h3");
          if (h) {
            h.id = "ux-mt";
            M.setAttribute("aria-labelledby", "ux-mt");
          }
          M.querySelectorAll(".mb button").forEach((b, i) => (i < 9 ? (b.dataset.k = i + 1) : b.removeAttribute("data-k")));
          if (M.contains(document.activeElement) && document.activeElement !== M) return;
          let t = null;
          if (lastBtn && lastBtn.a !== undefined) t = [...M.querySelectorAll("button:not(:disabled)")].find((b) => b.dataset.a === lastBtn.a && b.dataset.i === lastBtn.i);
          const mb = M.querySelectorAll(".mb button");
          t = t || M.querySelector("input:not([type=hidden]),select") || (mb.length === 1 && !mb[0].disabled ? mb[0] : null);
          (t || M).focus({ preventScroll: true });
        }
        new MutationObserver(() => {
          if (O.hidden) {
            document.body.classList.remove("ux-modal");
            if (prevFocus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
            prevFocus = null;
            lastBtn = null;
            return;
          }
          if (!prevFocus && !M.contains(document.activeElement)) prevFocus = document.activeElement;
          document.body.classList.add("ux-modal");
          tuneModal();
        }).observe(O, { attributes: true, attributeFilter: ["hidden"] });
        new MutationObserver(() => {
          if (!O.hidden) tuneModal();
        }).observe(M, { childList: true });

        /* ===== Alasan tombol nonaktif (toast) ===== */
        const WHY = {
          b: "Kas kurang, sudah hotel, atau bangun merata dulu di properti lain dalam set",
          s: "Belum ada bangunan untuk dijual (atau jual merata dulu)",
          g: "Kas kurang, MBG sudah maksimal, atau MBG dinonaktifkan",
          v: "Tidak ada MBG di properti ini",
          u: "Kas belum cukup untuk menebus",
          m: "Jual dulu rumah/MBG di set warna ini sebelum menggadaikan",
          l: "Uangmu belum cukup untuk melunasi",
          n: "Melebihi plafon pinjamanmu",
          e: "Kas belum cukup untuk memperbaiki",
        };
        function why(b) {
          if (b.id === "roll") return !O.hidden ? "Selesaikan dialog yang terbuka dulu" : MP.cl ? "Bukan giliranmu" : P[cur] && P[cur].b ? "Bot sedang bermain…" : "Belum bisa dilempar sekarang";
          if (b.id === "kbj") return "Kebijakan: hanya Presiden, sekali per putaran, di gilirannya";
          if (["mng", "bnk", "trd"].includes(b.id)) return "Bukan giliranmu";
          if (b.closest("#mod")) {
            const a = b.dataset.a;
            if (WHY[a]) return WHY[a];
            const t = b.textContent;
            if (/saham/i.test(t)) return "Uang kurang atau saham sudah maksimal (3)";
            if (/^\W*(Beli|Tawar|Bayar|Sewa|Tebus|Lunasi|Alat berat)/i.test(t.trim())) return "Uangmu belum cukup untuk pilihan ini";
            return "Pilihan ini belum tersedia";
          }
          return "Tidak tersedia saat ini";
        }
        document.addEventListener(
          "click",
          (e) => {
            const x = e.clientX,
              y = e.clientY;
            for (const b of $$("button:disabled")) {
              const r = b.getBoundingClientRect();
              if (r.width && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
                toast(why(b));
                buzz(30);
                return;
              }
            }
            const b = e.target.closest && e.target.closest("#mng,#bnk,#trd");
            if (b) {
              if (!O.hidden) toast("Selesaikan dialog yang sedang terbuka dulu");
              else if (!MP.cl && P[cur] && P[cur].b) toast("Sedang giliran bot — tunggu sebentar");
            }
          },
          true,
        );

        /* ===== Keyboard ===== */
        document.addEventListener("keydown", (e) => {
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          const tg = e.target,
            typing = /^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName);
          if (!O.hidden) {
            if (e.key === "Tab") {
              const f = [M, ...M.querySelectorAll("button:not(:disabled),input,select")];
              const i = f.indexOf(document.activeElement);
              const n = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : i === f.length - 1 ? 0 : i + 1;
              e.preventDefault();
              f[n].focus();
            } else if (e.key === "Escape") {
              const b = [...M.querySelectorAll("button:not(:disabled)")].filter((x) => /^(Tutup|Selesai|Batal)$/i.test(x.textContent.replace(/^\d+\s*/, "").trim())).pop();
              if (b && !blocked()) {
                e.preventDefault();
                b.click();
              }
            } else if (!typing && /^[1-9]$/.test(e.key) && !O.classList.contains("wt") && !blocked()) {
              const b = M.querySelectorAll(".mb button")[+e.key - 1];
              if (b && !b.disabled) {
                e.preventDefault();
                b.click();
              }
            }
            return;
          }
          if ($("#gb").classList.contains("o") || typing) return;
          if (tg.classList && tg.classList.contains("t") && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            tg.click();
            return;
          }
          if (tg.tagName === "BUTTON" || tg.tagName === "SUMMARY") return;
          const K = { " ": "#roll", Enter: "#roll", a: "#mng", b: "#bnk", d: "#trd", p: "#gtab", f: "#ux-fast", m: "#ux-snd" }[e.key.toLowerCase()];
          if (!K) return;
          const b = $(K);
          e.preventDefault();
          if (b.disabled) return toast(why(b));
          if (blocked() && /roll|mng|bnk|trd/.test(K)) return;
          b.click();
        });

        /* ===== Hint pertama kali ===== */
        if (!LS("ux-hint")) {
          const iv = setInterval(() => {
            if (P.length && O.hidden && LS("ux-tour") && !$("#ux-hint")) {
              clearInterval(iv);
              const h = document.createElement("div");
              h.id = "ux-hint";
              h.setAttribute("role", "region");
              h.setAttribute("aria-label", "Tips cepat");
              h.innerHTML =
                '<b>💡 Tips cepat</b><ul><li>Ketuk petak untuk melihat harga & sewa</li><li>Pintasan: Spasi = dadu · A Aset · B Bank · D Dagang · P Panduan · 1–9 pilih opsi</li><li>Tombol ⏩ mempercepat animasi</li></ul><button type="button">Mengerti</button>';
              h.querySelector("button").onclick = () => {
                h.remove();
                LS("ux-hint", "1");
              };
              document.body.appendChild(h);
            }
          }, 1500);
        }
      })();
    </script>

    <script id="ux-pro-js-2">
      (() => {
        "use strict";
        if (location.hash.startsWith("#join=")) return; /* tamu online langsung ke game */
        const $ = (s) => document.querySelector(s);
        const LS = (k, v) => {
          try {
            if (v === undefined) return localStorage.getItem(k);
            localStorage.setItem(k, v);
          } catch (e) {}
        };

        /* ===== Tur singkat ===== */
        const STEPS = [
          ["#board", "Papan permainan", "Ketuk petak mana saja untuk melihat harga dan sewa. Petak berkedip emas = posisi pemain yang sedang giliran. Angka kecil di sudut petak menunjukkan pemiliknya."],
          ["#who", "Giliran siapa?", "Banner ini selalu menunjukkan pemain yang sedang main dan kasnya. Warnanya mengikuti warna pion."],
          ["#pl", "Panel pemain", "Kas, utang, peran, kekayaan bersih, dan peringkat setiap pemain. Ketuk kotak warna kecil untuk melihat asetnya."],
          ["#roll", "Lempar dadu", "Tombol utama giliranmu. Pintasan keyboard: Spasi. Kalau tombol abu-abu, ketuk untuk tahu alasannya."],
          ["#mng", "Aset, Bank, Dagang", "Bangun rumah, gadai, pinjam uang, atau tukar properti kapan saja di gilirannya. Pintasan: A, B, D."],
          ["#gdk,#gtab", "Panduan & pengaturan", "Aturan lengkap ada di Panduan (P). Tombol ⏩ mempercepat animasi, 🔊 mengatur suara, 🔠 memperbesar teks."],
        ];
        let ti = 0,
          tour = null;
        function vis(sel) {
          for (const e of document.querySelectorAll(sel)) {
            const r = e.getBoundingClientRect();
            if (r.width > 8 && r.height > 8 && getComputedStyle(e).display !== "none") return e;
          }
          return null;
        }
        function showStep() {
          const [sel, ttl, txt] = STEPS[ti],
            el = vis(sel),
            sp = tour.querySelector(".sp"),
            bx = tour.querySelector(".bx");
          bx.innerHTML = `<div class="st">LANGKAH ${ti + 1} / ${STEPS.length}</div><b>${ttl}</b>${txt}${el ? "" : "<br><i>(bagian ini baru terlihat setelah permainan dimulai)</i>"}<div class="row"><button type="button" class="sk">Lewati</button><button type="button" class="nx">${ti == STEPS.length - 1 ? "Selesai ✓" : "Lanjut ➜"}</button></div>`;
          const H = innerHeight,
            bh = bx.offsetHeight;
          bx.style.top = "auto";
          bx.style.bottom = "auto";
          if (el) {
            el.scrollIntoView({ block: "nearest", inline: "nearest" });
            const r = el.getBoundingClientRect(),
              pad = 6;
            Object.assign(sp.style, { display: "block", left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" });
            if (r.height > H * 0.5) bx.style.bottom = "16px";
            else if (H - r.bottom >= bh + 24) bx.style.top = r.bottom + 14 + "px";
            else if (r.top >= bh + 24) bx.style.bottom = H - r.top + 14 + "px";
            else bx.style.bottom = "16px";
          } else {
            sp.style.display = "none";
            bx.style.top = Math.max(12, (H - bh) / 2) + "px";
          }
          bx.querySelector(".sk").onclick = endTour;
          const nx = bx.querySelector(".nx");
          nx.onclick = () => (ti == STEPS.length - 1 ? endTour() : (ti++, showStep()));
          nx.focus({ preventScroll: true });
        }
        function endTour() {
          if (tour) tour.hidden = true;
          LS("ux-tour", "1");
          window.removeEventListener("resize", rs);
          document.removeEventListener("keydown", tk, true);
        }
        const rs = () => tour && !tour.hidden && showStep(),
          tk = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              endTour();
            }
          };
        window.uxTour = () => {
          if (!tour) {
            tour = document.createElement("div");
            tour.id = "ux-tour";
            tour.setAttribute("role", "dialog");
            tour.setAttribute("aria-label", "Tur singkat");
            tour.innerHTML = '<div class="sp"></div><div class="bx"></div>';
            document.body.appendChild(tour);
          }
          tour.hidden = false;
          ti = 0;
          window.addEventListener("resize", rs);
          document.addEventListener("keydown", tk, true);
          showStep();
        };

        /* ===== Layar judul ===== */
        let sv = null;
        try {
          sv = JSON.parse(localStorage.getItem("monopoli-id-save"));

        const t = document.createElement("div");

        t.setAttribute("role", "dialog");

        t.setAttribute("aria-label", "Menu utama");

        t.innerHTML = `<div class="card"><h1>Monopoli<small>INDONESIA</small></h1>${has ? `<div class="sv">💾 Ada permainan tersimpan · putaran ${sv.rnd} · ${sv.P.length} pemain</div>` : ""}<div class="menu"><button type="button" class="pri" id="ux-go">${has ? "▶️ Lanjutkan / Main" : "🎲 Mulai Main"}</button><button type="button" id="ux-how">📖 Cara Bermain</button><button type="button" id="ux-tr">🎓 Tur Singkat</button></div><div class="ft">Main bersama teman lewat 🌐 Online · Pintasan: Spasi = lempar dadu</div></div>`;
        document.body.appendChild(t);
        const close = (after) => {
          t.hidden = true;
          after && setTimeout(after, 50);
        };
        $("#ux-go").onclick = () => {
          close();
          if (!LS("ux-tour")) {
            const iv = setInterval(() => {
              if (typeof P !== "undefined" && P.length && $("#ov").hidden) {
                clearInterval(iv);
                confirmTour();
              }
            }, 1000);
          }
        };
        $("#ux-how").onclick = () => close(() => ($("#gtab") || $("#gdk")).click());
        $("#ux-tr").onclick = () => close(window.uxTour);
        function confirmTour() {
          /* tawarkan tur sekali saja, tidak memaksa */
          const h = document.createElement("div");
          h.id = "ux-hint";
          h.innerHTML =
            '<b>🎓 Baru pertama kali?</b><p style="margin:6px 0 10px">Tur singkat 6 langkah menjelaskan layar permainan.</p><div style="display:flex;gap:8px"><button type="button" class="n" style="flex:1;background:#fff;color:#111">Nanti</button><button type="button" class="y" style="flex:2">Mulai tur</button></div>';
          h.querySelector(".n").onclick = () => {
            h.remove();
            LS("ux-tour", "1");
            LS("ux-hint", "1");
          };
          h.querySelector(".y").onclick = () => {
            h.remove();
            LS("ux-hint", "1");
            window.uxTour();
          };
          document.body.appendChild(h);
        }
        $("#ux-go").focus();
      })();
    </script>

    <script id="evt-js">
      // ===== EVENT BENCANA =====
      const EVENTS = []; // [{ pos, evId, umur, biaya, uid, rusak }]

          raw = T[i].p * a + (o.h || 0) * hcs(T[i]) * b;
        return Math.max(EV_CFG.min, Math.round((raw * R(p).cl * k * crM()) / 1e4) * 1e4);

          }
          render();
          const owners = [...new Set(fresh.map((e) => own[e.pos]?.o))].filter((id) => id !== undefined && P[id] && !P[id].x);
          for (const id of owners.filter((id) => P[id].b)) {
            const p = P[id];
            for (const t of new Set(fresh.filter((e) => own[e.pos]?.o === id).map((e) => e.pos))) {

          if (!hum.length)

            );

                UXFX.SFX.turn();
                UXFX.buzz(50);

            }

            el.innerHTML = h;

            presChips();

              `<h3>📜 Kebijakan Terakhir</h3><div class="sub">Presiden ${pn}</div>${
                PRES_LOG.length
                  ? sec(
                      "5 terakhir",
                      PRES_LOG.slice(0, 5)
                        .map((x) => rw("Putaran " + x.rnd + " · " + (P[x.id]?.n || "-"), x.key.toUpperCase()) + '<p style="margin:2px 0 8px;font-size:13px">' + x.note + "</p>")

              }<p style="font-size:13px">💡 Tahan lama chip untuk 🗣️ Sumpah Serapah Politik.</p>`,
              [["Tutup", 1]],
              {},
            );
          else if (c == "presbi")
            ask(`<h3>🏦 Bunga BI</h3>${dt(PRES.biT > 0 ? "Presiden " + pn + " mengubah bunga BI menjadi ×" + bi() + ". Berlaku " + PRES.biT + " putaran lagi." : "Tidak ada perubahan bunga aktif.")}`, [["Tutup", 1]], {});
          else if (c == "pressup") {
            const s = (PRES.sup || []).filter(al);
            ask(
              `<h3>🗳️ Pendukung Presiden</h3>${dt(s.length ? "Pendukung presiden: " + s.map((k) => P[k].n).join(", ") + ". Mereka dapat bonus Rp200rb saat pemilu dan Rp100rb tambahan tiap bansos massal." : "Tidak ada data pendukung.")}`,
              [["Tutup", 1]],
              {},

        async function sumpah() {

            if (MP.on && mpRem(cur)) return;
          } catch (e) {}
          PRES.sumpah = PRES.sumpah || [];
          const used = PRES.sumpah.includes(p.id),
            sup = (PRES.sup || []).filter(al);
          const c = await ask(
            `<h3>🗣️ Sumpah Serapah Politik</h3><div class="sub">${p.n}</div>${sec("Aksi", '<p class="ct">Kamu menyerapahi presiden di depan umum: <b>−1 pendukung</b>. Gratis, sekali per pemilu.</p>')}${sec("Status", rw("Pendukung presiden", sup.length) + rw("Jatahmu", used ? "sudah dipakai" : p.id === PRES.id ? "tidak berlaku untuk presiden" : "tersedia"))}`,
            [
              ["🗣️ Sumpah serapah", 1, used || p.id === PRES.id || !sup.length],
              ["Batal", 0],
            ],
            p,
          );
          if (!c) return;
          const q = P[sup[(Math.random() * sup.length) | 0]];
          PRES.sup = PRES.sup.filter((k) => k !== q.id);
          PRES.sumpah.push(p.id);
          say(`🗣️ ${p.n} bersumpah serapah: ${q.n} tidak lagi mendukung presiden`);
          render();
        }
        let tm = 0,
          lp = 0;
        el.addEventListener("pointerdown", (e) => {
          if (!e.target.closest(".preslast")) return;
          lp = 0;
          clearTimeout(tm);
          tm = setTimeout(() => {
            lp = 1;
            sumpah();
          }, 600);
        });
        ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => el.addEventListener(ev, () => clearTimeout(tm)));
        el.addEventListener("contextmenu", (e) => {
          if (e.target.closest(".preslast")) e.preventDefault();
        });
        el.addEventListener("click", (e) => {
          const c = e.target.closest(".chip");
          if (!c) return;
          if (lp) {
            lp = 0;
            return;
          }
          openChip(c.dataset.c);
        });
        el.addEventListener("keydown", (e) => {
          const c = e.target.closest(".chip");
          if (c && (e.key == "Enter" || e.key == " ")) {
            e.preventDefault();
            e.stopPropagation();
            openChip(c.dataset.c);
          }
        });
        presChips();
      })();
    </script>
  </body>
</html>
