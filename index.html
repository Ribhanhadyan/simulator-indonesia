<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Monopoli Indonesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #e8ede2;
        --tx: #1b1b1b;
        --card: #fffdf3;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #17201a;
          --tx: #eee;
          --card: #2a2f2b;
        }
      }
      :root[data-theme="dark"] {
        --bg: #17201a;
        --tx: #eee;
        --card: #2a2f2b;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family: Oswald, Impact, "Arial Narrow", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        align-items: flex-start;
        padding: 8px;
      }
      #board {
        --s: min(94vw, calc(100vh - 24px), 780px);
        width: var(--s);
        height: var(--s);
        display: grid;
        grid-template: 1.7fr repeat(10, 1fr) 1.7fr/1.7fr repeat(10, 1fr) 1.7fr;
        border: 3px solid #111;
        background: #cde6d2;
        font-size: calc(var(--s) / 113);
        color: #111;
      }
      .t {
        border: 1px solid #111;
        background: #e6f2e3;
        position: relative;
        display: flex;
        overflow: hidden;
        cursor: pointer;
        line-height: 1.05;
        text-align: center;
      }
      .bo {
        flex-direction: column;
      }
      .to {
        flex-direction: column-reverse;
      }
      .le {
        flex-direction: row-reverse;
      }
      .ri {
        flex-direction: row;
      }
      .cn {
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #f2f7ee;
      }
      .bar {
        flex: 0 0 24%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1px;
        flex-wrap: wrap;
        border: 0 solid #111;
      }
      .bo .bar {
        border-bottom-width: 1px;
      }
      .to .bar {
        border-top-width: 1px;
      }
      .le .bar {
        border-left-width: 1px;
      }
      .ri .bar {
        border-right-width: 1px;
      }
      .h {
        width: 1em;
        height: 1em;
        background: #1fb25a;
        border: 1px solid #111;
        display: block;
      }
      .h.H {
        background: #d62b1f;
        width: 2em;
      }
      .in {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1px;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.95em;
      }
      .cn .in {
        font-size: 1.15em;
      }
      .in i {
        font-style: normal;
        font-size: 1.9em;
      }
      .in small {
        font-size: 0.95em;
        font-weight: 400;
        text-transform: none;
      }
      .tk {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        font-size: 2em;
        line-height: 1;
        text-shadow:
          0 0 3px #fff,
          0 0 3px #fff;
      }
      #ctr {
        grid-area: 2/2/12/12;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4em;
        overflow: hidden;
      }
      .ban {
        z-index: 1;
        background: #d62b1f;
        color: #fff;
        font:
          700 10em/1 Oswald,
          Impact,
          sans-serif;
        letter-spacing: 0.04em;
        padding: 0.05em 0.25em 0;
        border: 0.06em solid #111;
        transform: rotate(-6deg);
        box-shadow: 0.06em 0.08em 0 #0005;
        text-align: center;
      }
      .ban small {
        display: block;
        font-size: 0.26em;
        background: #fff;
        color: #d62b1f;
        letter-spacing: 0.7em;
        padding: 0.25em 0 0.25em 0.7em;
        margin: 0 -0.97em 0 -0.97em;
        border-top: 0.2em solid #111;
      }
      .dk {
        position: absolute;
        width: 21%;
        height: 11%;
        border: 2px solid #111;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          700 1.6em Oswald,
          sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transform: rotate(45deg);
      }
      .d1 {
        left: 9%;
        top: 11%;
        background: #f7941d;
      }
      .d2 {
        right: 9%;
        bottom: 11%;
        background: #aee0f6;
      }
      #dice {
        z-index: 1;
        display: flex;
        gap: 1.4em;
        min-height: 6em;
      }
      .die {
        width: 6em;
        height: 6em;
        background: #fff;
        border: 2px solid #111;
        border-radius: 1em;
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        padding: 0.7em;
        box-shadow: 0.2em 0.3em 0 #0004;
      }
      .die i {
        width: 1.3em;
        height: 1.3em;
        border-radius: 50%;
        margin: auto;
      }
      .die i.p {
        background: #111;
      }
      #now {
        z-index: 1;
        font:
          600 1.7em Oswald,
          sans-serif;
        text-align: center;
        background: #fffdf3cc;
        padding: 0.3em 0.8em;
        border-radius: 0.4em;
        max-width: 80%;
        min-height: 1.6em;
      }
      #side {
        flex: 1 1 300px;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 15px;
      }
      .btns {
        display: flex;
        gap: 8px;
      }
      button {
        font:
          600 15px Oswald,
          sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 10px 12px;
        border: 2px solid #111;
        border-radius: 4px;
        background: #fff;
        color: #111;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 3px solid #ffd400;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #roll {
        flex: 2;
        background: #d62b1f;
        color: #fff;
      }
      #mng {
        flex: 1;
      }
      .pc {
        background: var(--card);
        border: 3px solid;
        border-radius: 6px;
        padding: 6px 8px;
      }
      .pc.on {
        box-shadow: 0 0 0 3px #ffd400;
      }
      .pc.out {
        opacity: 0.35;
        text-decoration: line-through;
      }
      .pc span {
        font-size: 1.4em;
      }
      .cash {
        font-weight: 700;
        font-size: 1.25em;
        color: #1b7f3a;
      }
      .ch s {
        display: inline-block;
        width: 1.5em;
        height: 1.5em;
        border: 1px solid #111;
        margin: 1px;
        cursor: pointer;
        font:
          700 11px/1.45em Oswald,
          sans-serif;
        text-align: center;
        text-shadow:
          0 0 2px #fff,
          0 0 2px #fff;
      }
      #log {
        background: var(--card);
        border-radius: 6px;
        padding: 6px 8px;
        height: 150px;
        overflow: auto;
        font:
          400 13px/1.4 system-ui,
          sans-serif;
      }
      #ov {
        position: fixed;
        inset: 0;
        background: #000b;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9;
        padding: 12px;
      }
      #ov[hidden] {
        display: none;
      }
      #mod {
        background: #fffdf3;
        color: #111;
        border: 3px solid #111;
        border-radius: 6px;
        max-width: 440px;
        width: 100%;
        max-height: 90vh;
        overflow: auto;
        padding-bottom: 12px;
        font-size: 16px;
      }
      #mod h3 {
        margin: 0 0 8px;
        padding: 10px;
        background: #d62b1f;
        color: #fff;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 20px;
      }
      #mod p {
        margin: 6px 14px;
        text-align: center;
        line-height: 1.35;
      }
      .mb {
        display: flex;
        gap: 8px;
        padding: 8px 14px 0;
        flex-wrap: wrap;
      }
      .mb button {
        flex: 1;
        min-width: 110px;
      }
      #mod input {
        display: block;
        width: calc(100% - 28px);
        margin: 6px 14px;
        padding: 8px;
        font:
          16px Oswald,
          sans-serif;
        border: 2px solid #111;
        border-radius: 4px;
      }
      .mr {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 4px 10px;
        padding: 4px;
        border: 1px solid #bbb;
        border-radius: 4px;
        flex-wrap: wrap;
        font-size: 14px;
      }
      .mr b {
        flex: 1 1 100%;
        padding: 2px 6px;
        border: 1px solid #111;
      }
      .mr button {
        padding: 5px 7px;
        font-size: 12px;
      }
      #bw {
        flex: 0 1 auto;
        max-width: 100%;
        overflow: auto;
      }
      #board {
        --s: max(min(94vw, calc(100vh - 24px), 780px), 620px);
      }
      .t {
        font-size: 1.3em;
      }
      .tk {
        font-size: 1.5em;
      }
      .in {
        padding: 2px;
        gap: 1px;
      }
      .cn .in {
        font-size: 1.05em;
      }
      #who {
        flex: 1 1 100%;
        text-align: center;
        font:
          700 clamp(18px, 3.4vw, 26px) Oswald,
          sans-serif;
        padding: 8px 12px;
        border: 3px solid #111;
        border-radius: 6px;
        color: #fff;
        text-shadow: 0 1px 2px #0008;
        transition: background 0.4s;
      }
      #who:empty {
        display: none;
      }
      #news {
        background: #fff6d6;
        color: #111;
        border: 2px solid #111;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 14px;
        line-height: 1.4;
      }
      .pc.on {
        transform: scale(1.02);
      }
      .pc.on b::after {
        content: " ◀ giliran";
      }
      .cur {
        display: inline-block;
        animation: hop 0.7s ease-in-out infinite;
        filter: drop-shadow(0 0 3px #ffd400);
      }
      @keyframes hop {
        50% {
          transform: translateY(-0.3em);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cur {
          animation: none;
        }
      }
      #mod .sr {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 6px 14px;
      }
      #mod .sr span {
        font-size: 26px;
      }
      #mod .sr input {
        flex: 1;
        margin: 0;
        width: auto;
        min-width: 0;
      }
      #mod select {
        font:
          16px Oswald,
          sans-serif;
        padding: 8px;
        border: 2px solid #111;
        border-radius: 4px;
      }
      #bw {
        padding: 46px;
      }
      #board {
        --s: max(min(calc(100vw - 100px), calc(100vh - 160px), 740px), 600px);
        position: relative;
      }
      .tk {
        display: none;
      }
      #pins {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 6;
      }
      .pw {
        position: absolute;
        width: 3.2em;
        height: 4.4em;
        margin: -4.4em 0 0 -1.6em;
        transform-origin: 50% 100%;
        transition:
          left 0.14s linear,
          top 0.14s linear,
          transform 0.14s linear;
        filter: drop-shadow(0 0.15em 0.15em #0006);
      }
      .pw .pn {
        width: 100%;
        height: 100%;
        display: block;
      }
      .pw.cur {
        z-index: 2;
      }
      .pw.cur .pn {
        animation: hop 0.9s ease-in-out infinite;
        filter: drop-shadow(0 0 0.35em #ffd400);
      }
      .pn {
        width: 0.8em;
        height: 1.15em;
        vertical-align: -0.2em;
      }
      @media (prefers-reduced-motion: reduce) {
        .pw.cur .pn {
          animation: none;
        }
      }
      #app {
        --pad: clamp(24px, 4vw, 44px);
        --s: max(280px, min(calc(100vw - 2 * var(--pad) - 16px), calc(100vh - 170px), 820px));
      }
      #bw {
        padding: var(--pad);
      }
      #board {
        --s: inherit;
      }
      #pins {
        --u: max(1em, 4.5px);
      }
      .ab {
        display: none;
        font-style: normal;
        font-weight: 700;
        font-size: max(0.9em, 5.5px);
      }
      @media (max-width: 760px) {
        .in span {
          display: none;
        }
        .ab {
          display: block;
        }
        .in small {
          font-size: max(1.1em, 6px);
        }
        .in i {
          font-size: max(1.7em, 12px);
        }
        .die {
          width: max(6em, 32px);
          height: max(6em, 32px);
          padding: max(0.7em, 3px);
        }
        .die i {
          width: max(1.3em, 5px);
          height: max(1.3em, 5px);
        }
        #now {
          font-size: max(1.7em, 12px);
        }
        .dk {
          font-size: max(1.5em, 7px);
        }
        .h {
          width: max(1em, 4px);
          height: max(1em, 4px);
        }
        .pw {
          width: max(3.2em, 15px);
          height: max(4.4em, 21px);
          margin: calc(-1 * max(4.4em, 21px)) 0 0 calc(-0.5 * max(3.2em, 15px));
        }
      }
      #mod .sub {
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #555;
        margin: -2px 0 6px;
      }
      .sec {
        margin: 10px 14px 0;
        border: 2px solid #111;
        border-radius: 4px;
        overflow: hidden;
        background: #fff;
      }
      .sec > h4 {
        margin: 0;
        padding: 4px 10px;
        background: #111;
        color: #fff;
        font:
          600 12px Oswald,
          sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .sec .rw {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 5px 10px;
        font-size: 15px;
      }
      .sec .rw + .rw {
        border-top: 1px solid #ddd;
      }
      #mod .sec p {
        margin: 0;
        padding: 8px 10px;
        text-align: left;
      }
      #mod .ct {
        font-size: 17px;
        line-height: 1.4;
      }
      #mod .ef {
        font-weight: 700;
        font-size: 17px;
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }
      .pw.cur .pn {
        animation: sway 3.2s ease-in-out infinite;
        transform-origin: 50% 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        .pw.cur .pn {
          animation: none;
        }
      }
      #bnk {
        flex: 1;
      }
      .dbt {
        font-size: 13px;
        color: #b3261e;
        font-weight: 600;
      }
      .sec .rw button {
        padding: 5px 8px;
        font-size: 12px;
      }
      @keyframes sway {
        0%,
        100% {
          transform: rotate(-1deg);
        }
        50% {
          transform: rotate(1deg);
        }
      }
      .bar {
        flex: 0 0 20%;
      }
      .t .in {
        font-size: 0.78em;
        line-height: 1.1;
      }
      .t.cn .in {
        font-size: 0.95em;
      }
      .t .in small {
        font-size: 0.85em;
      }
      .t .in i {
        font-size: 1.6em;
      }
      @media (max-width: 760px) {
        .t .in {
          font-size: max(0.78em, 6px);
        }
        .t .in small {
          font-size: max(1.1em, 6px);
        }
        .t .in i {
          font-size: max(1.7em, 12px);
        }
      }
      .pw.cur .pn {
        animation: none;
      }
      .btns {
        flex-wrap: wrap;
      }
      #roll {
        flex: 1 1 100%;
      }
      #trd {
        flex: 1;
      }
      #mod .ck {
        display: block;
        padding: 5px 10px;
        border-top: 1px solid #ddd;
        font-size: 15px;
      }
      #mod .ck input {
        display: inline;
        width: auto;
        margin: 0 8px 0 0;
      }
      #mod .sec input[type="number"] {
        width: calc(100% - 20px);
        margin: 6px 10px;
      }
      .pop {
        position: fixed;
        z-index: 30;
        pointer-events: none;
        font:
          700 20px Oswald,
          sans-serif;
        white-space: nowrap;
        text-shadow:
          0 1px 2px #fff,
          0 0 6px #fff;
        animation: rise 2.2s ease-out forwards;
      }
      .pop.up {
        color: #1b7f3a;
      }
      .pop.dn {
        color: #b3261e;
      }
      @keyframes rise {
        0% {
          opacity: 0;
          transform: translateY(8px) scale(0.8);
        }
        12% {
          opacity: 1;
          transform: translateY(0) scale(1.15);
        }
        100% {
          opacity: 0;
          transform: translateY(-44px) scale(1);
        }
      }
      @keyframes fade {
        0%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pop {
          animation: fade 2.2s forwards;
        }
      }
      .pw.cur {
        animation: none;
      }
      .rl {
        font-size: 13px;
        font-weight: 600;
        opacity: 0.85;
      }
      .pw.pol {
        filter: drop-shadow(0 0 0.3em #3f51b5) drop-shadow(0 0.15em 0.15em #0006);
        z-index: 3;
      }
      .h.M {
        background: #2f6bff;
      }
      .mbt {
        color: #2f6bff;
      }
      #kbj {
        flex: 1;
        background: #ffd400;
      }
      #ng {
        flex: 1;
      }
      #ng.arm {
        background: #ffd400;
      }
      #gtab {
        position: fixed;
        right: 0;
        top: 38%;
        z-index: 25;
        writing-mode: vertical-rl;
        padding: 12px 6px;
        background: #d62b1f;
        color: #fff;
        border-right: 0;
        border-radius: 8px 0 0 8px;
        letter-spacing: 0.1em;
      }
      #gb {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(92vw, 420px);
        z-index: 26;
        background: var(--card);
        color: var(--tx);
        border-left: 3px solid #111;
        display: flex;
        flex-direction: column;
        visibility: hidden;
        transform: translateX(100%);
        transition:
          transform 0.25s ease,
          visibility 0s 0.25s;
        padding-top: env(safe-area-inset-top, 0px);
        font:
          400 15px/1.45 system-ui,
          sans-serif;
      }
      #gb.o {
        visibility: visible;
        transform: none;
        transition: transform 0.25s ease;
      }
      .gh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        background: #d62b1f;
        color: #fff;
        font:
          700 20px Oswald,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .gh button {
        padding: 4px 10px;
      }
      #gc {
        overflow: auto;
        padding: 8px 10px 24px;
        flex: 1;
      }
      #gc details {
        border: 2px solid #111;
        border-radius: 6px;
        margin: 8px 0;
        background: var(--bg);
      }
      #gc summary {
        cursor: pointer;
        padding: 8px 10px;
        font:
          600 17px Oswald,
          sans-serif;
        letter-spacing: 0.04em;
      }
      #gc details > div {
        padding: 0 12px 10px;
      }
      #gc ul {
        margin: 4px 0;
        padding-left: 18px;
      }
      #gc li {
        margin: 3px 0;
      }
      #gc p {
        margin: 6px 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #gb,
        #gb.o {
          transition: none;
        }
      }
      .t[data-st]::after {
        content: "🏛️";
        position: absolute;
        top: 0;
        right: 1px;
        font-size: max(1.5em, 9px);
        line-height: 1;
        pointer-events: none;
      }
      .t.la {
        background: #ffe9a8;
      }
      .t.bu {
        background: #cfe3ff;
      }
      .t.ap {
        background: #d9efff;
      }
      .gl {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        font:
          700 max(0.95em, 7px)/1.3 Oswald,

          welcome: (pr) => (c) => {
            const p = { c, seat: -2, name: "", tok: "" };
            c.cable.reliable.onmessage = (e) => mpMsg(p, e.data);
            return () => mpLeave(p);
          },
          closed: () => {
            MP.on = 0;
            MP.st = "Koneksi ke signaller putus";
            mpPanel();
          },
        });
        MP.on = 1;
        MP.code = MP.sp.invite;
        mpPanel(true);
        const ob = new MutationObserver(() => {
            clearTimeout(MP.tm);
            MP.tm = setTimeout(mpTick, 70);
          }),
          o = { subtree: true, childList: true, attributes: true, characterData: true };
        ob.observe($("#app"), o);
        ob.observe(ov, o);
        document.addEventListener(
          "click",
          (e) => {
            if (!e.isTrusted) return;
            const t = e.target;
            if ((t.closest("#mod") && mpRem(mpOwn())) || (t.closest("#roll,#mng,#bnk,#trd,#kbj") && mpRem(cur))) {
              e.stopPropagation();
              e.preventDefault();
            }
          },
          true,
        );
        {
          const _a = ask;
          ask = function (h, b, w) {
            const ww = w || P[cur];
            if (!ww?.b) MP.ao = ww && ww.id >= 0 ? ww.id : ww && ww.id < 0 ? cur : 0;
            const r = _a(h, b, w);
            r.then(() => {
              MP.ao = null;
            });
            if (/Nama Pemain/.test(h)) mpPre();
            return r;
          };
        }
        mpTick();
      }
      function mpApply(d) {
        for (const k in d) {
          const v = d[k];
          if (k == "who") {
            $("#who").innerHTML = v[0];
            $("#who").style.background = v[1];
          } else if (k == "tiles") {
            $("#board")
              .querySelectorAll(":scope>:not(#pins):not(#ctr)")
              .forEach((e) => e.remove());
            $("#board").insertAdjacentHTML("beforeend", v);
          } else if (k == "btn") {
            $("#roll").textContent = v[0];
            MP.rd = v[1];
            $("#kbj").style.display = v[2];
          } else if (k == "ov") {
            ov.hidden = v[0];
            mod.innerHTML = v[1];
          } else if (k == "m") {
            [MP.ow, MP.cur, MP.on_, MP.mv] = v;
          } else $("#" + k).innerHTML = v;
        }
        const my = MP.cur === MP.seat;
        $("#roll").disabled = !!MP.rd || !my;
        ["mng", "bnk", "trd", "kbj"].forEach((i) => ($("#" + i).disabled = !my));
        const lk = MP.ow !== MP.seat;
        ov.classList.toggle("wt", lk);
        const w = $("#wtb");
        w.hidden = ov.hidden || !lk;
        w.textContent = "⏳ Menunggu " + MP.on_ + "…";
      }
      async function mpJoin(code) {
        MP.cl = 1;
        document.body.classList.add("cl");
        MP.pv = 1;
        MP.st = "Menyambung…";
        mpPanel();
        const nm = (prompt("Nama kamu:", sessionStorage.mpn || "") || "Tamu").trim().slice(0, 12);
        sessionStorage.mpn = nm;
        const k = (sessionStorage.mpk = sessionStorage.mpk || Math.random().toString(36).slice(2));
        document.addEventListener("click", (e) => {
          const t = e.target,
            b = t.closest("#roll,#mng,#bnk,#trd,#kbj"),
            T = t.closest("#board .t");
          if (b) mpTx({ t: "b", id: b.id });
          else if (T && ov.hidden) mpTx({ t: "c", r: "t", p: $$("#board .t").indexOf(T) });
          else if (t.closest("#pl") && ov.hidden) mpTx({ t: "c", r: "pl", p: pth($("#pl"), t) });
          else if (t.closest("#mod") && !ov.classList.contains("wt")) mpTx({ t: "c", r: "mod", p: pth(mod, t), v: MP.mv });
        });
        ["input", "change"].forEach((ev) =>
          mod.addEventListener(ev, (e) => {
            const t = e.target;
            if (ov.classList.contains("wt")) return;
            mpTx({ t: "i", ev, p: pth(mod, t), val: t.value, ck: t.checked, v: MP.mv });
          }),
        );
        try {
          const S = await mpL();
          MP.sp = await S.join({
            invite: code,
            disconnected: () => {
              MP.st = "❌ Terputus dari host. Muat ulang halaman untuk bergabung lagi.";
              mpPanel();
            },
          });
          MP.sp.connection.cable.reliable.onmessage = (e) => {
            const m = JSON.parse(e.data);
            if (m.t == "hi") {
              MP.seat = m.seat;
              MP.st = m.seat >= 0 ? "✅ Tersambung · kamu Pemain " + (m.seat + 1) : "👀 Tersambung sebagai penonton";
              mpPanel();
            } else if (m.t == "s") mpApply(m.d);
          };
          mpTx({ t: "j", n: nm, k });
        } catch (e) {
          MP.st = "❌ Gagal bergabung: " + (e.message || e);
          mpPanel();
        }
      }
      $("#mpb").onclick = () => mpHost().catch((e) => alert("Gagal memulai online: " + (e.message || e)));
      location.hash.startsWith("#join=") ? mpJoin(location.hash.slice(6)) : boot();
    </script>
  </body>
</html>
